on:
  push:
    branches:
      - master



jobs:
  build:
    runs-on: ubuntu-latest

  
    steps:

      - uses: actions/checkout@v3
      - name: "docker login 2"
        run: docker login --username ${{ secrets.DOCKERNAME }} --password ${{ secrets.DOCKERTOCN }}

      - name: "build image bacend"
        run: docker build -t ${{ secrets.DOCKERNAME }}/docker ./backend

      - name: "push image"
        run: docker push ${{ secrets.DOCKERNAME }}/docker

      - name: "build image frontend"
        run: docker build -t ${{ secrets.DOCKERNAME }}/docker ./frontend

      - name: "push image"
        run: docker push ${{ secrets.DOCKERNAME }}/docker